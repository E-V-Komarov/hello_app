name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: hello-linux
          - os: windows-latest
            artifact: hello-windows.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libgles2-mesa-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libsm6 libxext6 libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ ДЛЯ WINDOWS: задаём бэкенд ANGLE перед PyInstaller
      - name: Set Kivy GL backend for Windows (angle_sdl2)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: echo "KIVY_GL_BACKEND=angle_sdl2" >> $env:GITHUB_ENV

      - name: Build with PyInstaller
        run: pyinstaller --onefile --name hello main.py

      - name: Rename artifact
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv dist/hello.exe "dist/${{ matrix.artifact }}"
          else
            mv dist/hello "dist/${{ matrix.artifact }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ: используем оригинальный экшен, у которого есть тег v1
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          buildozer_version: master   # или stable, если master нестабилен

      - uses: actions/upload-artifact@v4
        with:
          name: hello-android.apk
          path: bin/*.apk

  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-merge: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: "artifacts/*"
          generate_release_notes: true
